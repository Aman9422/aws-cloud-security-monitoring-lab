<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Security Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 700px;
            text-align: center;
            padding: 48px 30px;
            border: 1px solid #334155;
            border-radius: 18px;
            background: #1e293b;
        }

        .tag {
            color: #38bdf8;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            margin: 22px 0;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #064e3b;
            color: #6ee7b7;
            border-radius: 30px;
            font-size: 14px;
        }

        footer {
            margin-top: 35px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="tag">AWS Cloud Security Lab</div>

        <h1>Hello, <span>World!</span></h1>

        <p>
            Welcome to my AWS-hosted demonstration website.
            This application is part of a cloud security and
            infrastructure automation project.
        </p>

        <div class="status">
            Demo Application
        </div>

        <footer>
            Powered by AWS Infrastructure
        </footer>
    </main>
</body>
</html>
